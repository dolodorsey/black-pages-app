name: Patch Black Pages Preview Compatibility

on:
  push:
    branches:
      - agent/black-pages-digital-directory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/black-pages-digital-directory
      - name: Patch incompatible icon and Map shadowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          text = text.replace('  Instagram,\n', '  Camera,\n')
          text = text.replace('  Map,\n', '  Map as MapIcon,\n')
          text = text.replace('<Instagram />', '<Camera />')
          text = text.replace("['map', Map, 'Map']", "['map', MapIcon, 'Map']")
          text = text.replace('new Map<string, number>()', 'new globalThis.Map<string, number>()')
          path.write_text(text)
          PY
      - name: Commit compatibility patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          git commit -m 'fix Black Pages preview compatibility'
          git push origin HEAD:agent/black-pages-digital-directory
