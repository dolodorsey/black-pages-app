name: BLACK PAGES Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Vercel project `the-black-pages` (nodeVersion 24.x).
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile fidelity
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --no-audit --no-fund
          if ! git diff --exit-code -- package-lock.json; then
            echo "package-lock.json would be modified by install; commit the updated lockfile."
            exit 1
          fi

      - name: Lint application
        run: npm run lint

      - name: Type-check application
        run: npx tsc -b --force

      - name: Run unit tests
        run: npm run test

      - name: Build production application
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Verify build info is published
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/build-info.json
          cat dist/build-info.json
          grep -Fq "${{ github.sha }}" dist/build-info.json
          grep -Fq "${{ github.sha }}" dist/assets/*.js

      - name: Verify evidence-review safety contract
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/20260804110000_black_pages_evidence_review_gate.sql"
          test -f "$file"
          grep -Fq "auth.role()<>'service_role'" "$file"
          grep -Fq "Reviewer and decision reason are required" "$file"
          grep -Fq "Explicit public ownership evidence is incomplete" "$file"
          grep -Fq "new_directory_record_published',false" "$file"
          grep -Fq "status='revoked'" "$file"
          grep -Fq "expires_at" "$file"
          grep -Fq "revoke all on table public.black_pages_evidence_reviews from public,anon,authenticated" "$file"
          if grep -Eqi "grant .*black_pages_evidence_reviews.*(anon|authenticated)" "$file"; then
            echo "Private review ledger must not be granted to client roles"
            exit 1
          fi
          if grep -Eqi "grant execute .*black_pages_(review|revoke).* to (anon|authenticated)" "$file"; then
            echo "Review decisions must remain service-role only"
            exit 1
          fi

      - name: Verify identity-bundle review safety contract
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/20260812230000_black_pages_candidate_identity_resolution.sql"
          test -f "$file"
          grep -Fq "Maximum 100 business identities per review batch" "$file"
          grep -Fq "A human review reason is required" "$file"
          grep -Fq "new_directory_records_published',0" "$file"
          grep -Fq "new_directory_record_published',false" "$file"
          grep -Fq "revoke all on public.black_pages_candidate_identities,public.black_pages_candidate_identity_members,public.black_pages_candidate_identity_reviews from public,anon,authenticated" "$file"
          if grep -Eqi "grant .*black_pages_candidate_identity_(members|reviews).* to .*(anon|authenticated)" "$file"; then
            echo "Private identity evidence tables must not be granted to client roles"
            exit 1
          fi

      - name: Verify publication factory safety contract
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/20260813002000_black_pages_publication_factory_source_intelligence.sql"
          test -f "$file"
          grep -Fq "A final publication reason is required" "$file"
          grep -Fq "Draft must be Ready before publication" "$file"
          grep -Fq "Identity is not human-approved" "$file"
          grep -Fq "Publication requires source evidence" "$file"
          grep -Fq "revoke all on public.black_pages_publication_drafts from public,anon,authenticated" "$file"
          grep -Fq "grant execute on function public.black_pages_staff_publish_draft(uuid,text) to authenticated" "$file"
          if grep -Eqi "grant .*black_pages_publication_drafts.* to .*(anon|authenticated)" "$file"; then
            echo "Publication drafts must remain private"
            exit 1
          fi

      - name: Verify privileged claim routines stay service-role only
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/20260809120000_black_pages_revoke_privileged_claim_routines.sql"
          test -f "$file"
          grep -Fq "revoke all on function public.black_pages_approve_owner_claim(uuid, text)" "$file"
          grep -Fq "revoke all on function public.black_pages_initialize_claim_verification()" "$file"
          if grep -Eqi "grant execute .*black_pages_(approve_owner_claim|initialize_claim_verification).* to .*(anon|authenticated)" "$file"; then
            echo "Privileged claim routines must not be executable by client roles"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
